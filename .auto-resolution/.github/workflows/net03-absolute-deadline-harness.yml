name: NET-03 Absolute Deadline Harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test NET-03 harness
        run: python3 -m unittest discover -s tools/gates/tests -p 'test_net03_absolute_deadline.py' -v
      - name: Compile harness
        run: python3 -m py_compile tools/gates/net03_absolute_deadline.py tools/gates/net03_absolute_deadline_sources.py
