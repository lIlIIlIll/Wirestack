name: Threat Model

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate threat model
        run: python3 tools/validate_threat_model.py
      - name: Test threat-model validator
        run: python3 -m unittest discover -s tools/tests -p 'test_validate_threat_model.py' -v
      - name: Compile validator
        run: python3 -m py_compile tools/validate_threat_model.py
