name: NET-05 Large Buffer Profile Harness

on:
  pull_request:
    paths:
      - "tools/gates/net05_large_buffer_profile.py"
      - "tools/gates/net05_large_buffer_profile_sources.py"
      - "tools/gates/tests/test_net05_large_buffer_profile.py"
      - "scripts/gate-net05-large-buffer-profile"
      - ".github/workflows/net05-large-buffer-profile-harness.yml"
  push:
    branches: [main]
    paths:
      - "tools/gates/net05_large_buffer_profile.py"
      - "tools/gates/net05_large_buffer_profile_sources.py"
      - "tools/gates/tests/test_net05_large_buffer_profile.py"
      - "scripts/gate-net05-large-buffer-profile"
      - ".github/workflows/net05-large-buffer-profile-harness.yml"

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test NET-05 harness
        run: python3 -m unittest discover -s tools/gates/tests -p 'test_net05_large_buffer_profile.py' -v
      - name: Compile harness
        run: python3 -m py_compile tools/gates/net05_large_buffer_profile.py tools/gates/net05_large_buffer_profile_sources.py
