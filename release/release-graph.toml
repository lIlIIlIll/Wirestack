schema_version = 1
release_version = "0.1.0"
status = "migration"

# This file is the only ordered inventory of published yjson packages. Release
# tooling must derive package names, versions, manifests, source roots, and
# dependency pairing from this graph instead of maintaining private lists.
# Dependencies must appear before their consumers so this is also the registry
# publication order.

[[packages]]
name = "yjson"
role = "core"
development_manifest = "cjpm.toml"
release_manifest = "release/package-manifests/yjson.toml"
source_root = "src"
stage_kind = "core"
stability = "stable"
leaf_bundle = true
dependencies = []
test_dependencies = ["yjson_macros"]

[[packages]]
name = "yjson_macros"
role = "macros"
development_manifest = "packages/yjson_macros/cjpm.toml"
release_manifest = "release/package-manifests/yjson_macros.toml"
