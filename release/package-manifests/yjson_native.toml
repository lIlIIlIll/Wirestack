[package]
cjc-version = "1.1.0"
name = "yjson_native"
description = "Optional Linux x86_64 native facade for yjson"
version = "1.0.0"
script-dir = ""
output-type = "dynamic"
compile-option = "-O2"
link-option = "-L target/native -lyjson_scanner"

[dependencies]
# The public Float64 backend seam is compiled against this exact core release.
yjson = "1.0.0"
