# Current additive declaration inventory. `release_version` identifies the
# immutable baseline; entries added after that tag describe the Unreleased
# development delta and are not claims about the tagged RC artifact.
# This does not replace the complete symbol inventory used by SDK ABI tooling.
inventory_version = 1
release_version = "1.0.0-rc.1"
package_manifest_version = "1.0.0"
status = "development-after-baseline"
compatibility_policy = "The 1.0.0-rc.1 baseline is frozen; post-tag inventory changes are Unreleased deltas that require review and consumer rebuild validation"

[package_pairing]
core = "1.0.0"
macros = "1.0.0"
aggregate = "1.0.0"
native = "1.0.0"
yyjson = "1.0.0"
rule = "Generated macro output and the optional native facade must be consumed with the same yjson core release."

