source = "src/lib_json_compact_document.cj"
needle = "public static func parseBorrowed(bytes: Array<Byte>,"
stability = "stable-compact-input-ownership"
compatibility = "additive explicit ownership entries; parse remains a borrowed-input compatibility alias"
contract = "Borrowed parsing retains caller bytes and forbids mutation or concurrent writes for the document lifetime; owned parsing copies before parse."
consumer = "Applications choosing between zero-copy input retention and caller-mutation isolation"

