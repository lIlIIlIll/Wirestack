# yjson 0.1 migration API inventory. The complete declaration list is
# release/public-api-snapshot.txt.
inventory_version = 1
status = "0.1.0-migration"
compatibility_policy = "0.x minors may break with an API diff and migration guide; 0.x patches preserve documented stability classes"

