name: TLS Provider PoC

on:
  pull_request:
    paths:
      - "tools/tls_provider_poc/**"
      - "tools/tests/test_tls_provider_poc.py"
      - "docs/architecture/tls-provider-poc-contract.md"
      - "docs/evidence/M0-016/**"
      - "scripts/tls-provider-poc"
      - ".github/workflows/tls-provider-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider pins and platform matrix
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --matrix docs/evidence/M0-016/platform-matrix.json
      - name: Run fail-closed validator tests
        run: python3 -m unittest discover -s tools/tests -p 'test_tls_provider_poc.py' -v
      - name: Compile Python tools
        run: python3 -m py_compile tools/tls_provider_poc/run.py tools/tls_provider_poc/validate.py

  linux-glibc:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl git openssl ca-certificates
      - name: Build pinned provider and execute caller-driven PoC
        run: |
          python3 tools/tls_provider_poc/run.py \
            --provider "${{ matrix.provider }}" \
            --output "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - name: Validate native result
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --result "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-linux-glibc-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
          if-no-files-found: warn
