name: yjson-ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  repository: read

jobs:
  api-inventory:
    runs-on: [self-hosted, linux, x64, cangjie-1.1]
    env:
      # Self-hosted runners may schedule several jobs on one machine. Every
      # job uses a unique working directory keyed by the run id plus a short
      # job suffix so concurrent jobs never share or overwrite a checkout.
      YJ_WS: "${{ runner.temp }}/yjson-api-inventory-${{ github.run_id }}"
    steps:
      - name: Checkout source
        run: |
          set -euo pipefail
          if [[ -e "$YJ_WS" ]]; then rm -rf "$YJ_WS"; fi
          mkdir -p "$YJ_WS"
          git clone https://gitcode.com/${ATOMGIT_REPOSITORY}.git "$YJ_WS/repo_workspace"
          cd "$YJ_WS/repo_workspace" && git checkout --detach ${ATOMGIT_SHA}
      - name: Record toolchain and runner identity
        run: |
          cjc -v
          cjpm --version
          printf 'runner=%s run_id=%s job=%s workspace=%s\n' \
            "${RUNNER_NAME:-unknown}" "${ATOMGIT_RUN_ID:-unknown}" \
            "${ATOMGIT_JOB:-unknown}" "$YJ_WS"
      - name: Check public API inventory
        run: cd "$YJ_WS/repo_workspace" && scripts/ci_job.sh api-inventory
      - name: Clean up working directory
        if: always()
        run: rm -rf "$YJ_WS"
  runtime-freeze:
    runs-on: [self-hosted, linux, x64, cangjie-1.1]
