[package]
  cjc-version = "1.1.0"
  name = "yjson_native_accel"
  organization = ""
  description = "Single-option startup acceleration for yjson"
  version = "0.1.0"
  output-type = "static"
  compile-option = "-O2"
  link-option = "-L target/native -lyjson_scanner"

[dependencies]
  yjson_native_primitives = { path = "../yjson_native_primitives" }

[test-dependencies]
  yjson = { path = "../.." }
  yjson_macros = { git = "https://github.com/lIlIIlIll/yjson_macros.git", commitId = "fec0adce41f73d037d876cbac7a28aee8108bb5c" }
