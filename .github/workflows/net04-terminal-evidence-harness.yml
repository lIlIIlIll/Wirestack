name: NET-04 Terminal Evidence Harness
on:
  pull_request:
    paths:
      - "tools/gates/net04_terminal_evidence.py"
      - "tools/gates/net04_terminal_evidence_sources.py"
      - "tools/gates/tests/test_net04_terminal_evidence.py"
      - "scripts/gate-net04-terminal-evidence"
      - ".github/workflows/net04-terminal-evidence-harness.yml"
  push:
    branches: [main]
    paths:
      - "tools/gates/net04_terminal_evidence.py"
      - "tools/gates/net04_terminal_evidence_sources.py"
      - "tools/gates/tests/test_net04_terminal_evidence.py"
      - "scripts/gate-net04-terminal-evidence"
      - ".github/workflows/net04-terminal-evidence-harness.yml"
permissions:
  contents: read
jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test NET-04 harness
        run: python3 -m unittest discover -s tools/gates/tests -p 'test_net04_terminal_evidence.py' -v
      - name: Compile harness
        run: python3 -m py_compile tools/gates/net04_terminal_evidence.py tools/gates/net04_terminal_evidence_sources.py
