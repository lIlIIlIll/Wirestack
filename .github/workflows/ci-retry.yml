name: CI retry watchdog

# The pinned nightly's llc deterministically SIGSEGVs while lowering
# Cangjie bitcode on a fraction of GitHub-hosted runner CPU models, which
# turns affected compile gates into a host-allocation lottery. Re-running
# failed jobs re-allocates runners; the bounded retries below usually
# land every gate on a healthy host without touching any code. Each run
# is retried at most twice; genuine failures still exhaust the budget.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed-jobs:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs" -X POST; then
              echo "requested rerun for run $RUN_ID"
              exit 0
            fi
            echo "rerun request rejected (attempt $attempt); waiting before retrying"
            sleep 30
          done
          echo "could not request rerun for run $RUN_ID" >&2
          exit 1
