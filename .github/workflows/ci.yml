name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      cangjie_version:
        description: Exact Cangjie nightly version for release qualification
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci-guardrails:
    name: CI guardrail regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          submodules: recursive
      - name: Install probe compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Test failure propagation and candidate wiring
        env:
          YJSON_REQUIRE_UBSAN_PROBE: '1'
        run: python3 scripts/test_ci_candidate_wiring.py

  generated-change-risk:
    name: Generated code change risk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
      - name: Require external runtime tests for macro and SPI changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then base="$PUSH_BASE_SHA"; fi
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
            python3 scripts/check_generated_change_risk.py --base "$base"
          else
            python3 scripts/check_generated_change_risk.py
          fi

  perf-evidence-drift:
    name: Seven-library evidence drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
      - name: Verify current seven-library evidence
        env:
          # Development may contain unmeasured performance-input changes. The
          # main contract remains strict for PRs, pushes, scheduled runs, and
          # manual dispatches.
          YJSON_EVIDENCE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'integrity-only' || 'strict' }}
        run: scripts/ci_job.sh perf-evidence-drift "$YJSON_EVIDENCE_MODE"

  stream-docs:
    name: Stream evidence drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          submodules: recursive
      - name: Verify frozen Stream evidence and generated documentation
        run: scripts/ci_job.sh stream-docs

  nightly:
    name: Cangjie nightly (7-day window)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      resolution: ${{ steps.version.outputs.resolution }}
      window: ${{ steps.window.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          submodules: recursive
      - name: Test nightly and candidate wiring
        run: |
          python3 scripts/test_latest_cangjie_nightly.py
      - name: Select seven-day cache window
        id: window
        run: echo "value=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"
      - name: Export shared nightly version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.cangjie_version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            value=$(python3 scripts/latest_cangjie_nightly.py \
              --validate-version "$REQUESTED_VERSION")
            resolution=workflow-dispatch-exact
          else
            # Keep the known-good pin independent of latest-release availability.
            value=1.3.0-alpha.20260829010011
            python3 scripts/latest_cangjie_nightly.py \
              --validate-version "$value" >/dev/null
            resolution=pinned-known-good
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "resolution=$resolution" >> "$GITHUB_OUTPUT"
          echo "resolved_cangjie_version=$value resolution=$resolution window=${{ steps.window.outputs.value }}"
          {
            echo '### Cangjie nightly selection'
            echo
            echo "- Version: \`$value\`"
            echo "- Resolution: \`$resolution\`"
            echo "- Seven-day window: \`${{ steps.window.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (${{ matrix.gate }})
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate:
          - api-inventory
          - cjdoc-qualification
          - runtime-freeze
          - core
          - standards-conformance
          - schema-formats-conformance
          - examples
          - macro-consumer
          - algorithms-consumer
          - registry-rehearsal
          - custom-native
          - yyjson-native
          - native-clang
          - native-gcc
          - sanitizer
          - fuzz-short
          - yyjson-colink
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ needs.nightly.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie-nightly.tar.gz
      - name: Install native prerequisites
        if: contains(fromJSON('["standards-conformance","schema-formats-conformance","algorithms-consumer","registry-rehearsal","custom-native","yyjson-native","native-clang","native-gcc","sanitizer","fuzz-short","yyjson-colink"]'), matrix.gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc libidn2-dev
          dpkg-query -W -f='${Package}=${Version}\n' clang gcc libidn2-dev
      - name: Restore pinned standards suites cache
        if: contains(fromJSON('["standards-conformance","schema-formats-conformance"]'), matrix.gate)
        id: standards-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/yjson-standards-suites
          # The key fingerprints the pinned suite revisions embedded in the
          # runner, so any suite revision change rotates the cache.
          key: yjson-standards-suites-${{ hashFiles('scripts/run_standards_conformance.py') }}
      - name: Prefetch pinned standards suites with SHA-256 verification
        if: contains(fromJSON('["standards-conformance","schema-formats-conformance"]'), matrix.gate) && steps.standards-cache.outputs.cache-hit != 'true'
        run: python3 scripts/run_standards_conformance.py --prefetch --cache /tmp/yjson-standards-suites
      - name: Fetch pinned yyjson co-link fixture
        if: matrix.gate == 'yyjson-colink'
        run: |
          curl -fL https://github.com/ibireme/yyjson/archive/refs/tags/0.11.1.tar.gz -o /tmp/yyjson-0.11.1.tar.gz
          echo '610a38a5e59192063f5f581ce0c3c1869971c458ea11b58dfe00d1c8269e255d  /tmp/yyjson-0.11.1.tar.gz' | sha256sum -c -
          mkdir -p /tmp/yjson-yyjson-second
          tar -xzf /tmp/yyjson-0.11.1.tar.gz -C /tmp/yjson-yyjson-second
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.nightly.outputs.version }} resolution=${{ needs.nightly.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          sha256sum "$RUNNER_TEMP/cangjie-nightly.tar.gz"
      - name: Run gate
        env:
          YJSON_RESOLVED_NIGHTLY: ${{ needs.nightly.outputs.version }}
          YJSON_SECOND_YYJSON_ROOT: ${{ matrix.gate == 'yyjson-colink' && '/tmp/yjson-yyjson-second/yyjson-0.11.1' || '' }}
          YJSON_STANDARDS_OFFLINE: ${{ contains(fromJSON('["standards-conformance","schema-formats-conformance"]'), matrix.gate) && '1' || '' }}
          # The pinned nightly's LLVM llc crashes at -O2 in external-consumer,
          # examples, and conformance builds on ubuntu-24.04.
          YJSON_CI_DEPENDENCY_OVERRIDE: ${{ contains(fromJSON('["algorithms-consumer","examples","macro-consumer","registry-rehearsal","custom-native","yyjson-native","schema-formats-conformance","standards-conformance"]'), matrix.gate) && '-O1' || '' }}
        run: |
          ulimit -s 131072
          ulimit -s
          scripts/ci_job.sh "${{ matrix.gate }}"

  pure-platforms:
    name: Pure (${{ matrix.os }})
    needs: nightly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            archive: cangjie-nightly.zip
            checksum: sha256sum
          - os: macos-14
            archive: cangjie-nightly.tar.gz
            checksum: shasum -a 256
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          submodules: recursive
      - name: Setup Cangjie
        if: matrix.os != 'windows-2022'
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ needs.nightly.outputs.version }}
          archive-path: ${{ runner.temp }}/${{ matrix.archive }}
      # Upstream gitcode ships a stale <archive>.sha256 for Windows nightlies
      # (server checksum does not match the re-uploaded artifact), which makes
      # setup-cangjie v2.3.0 abort with a SHA256 mismatch. Download and install
      # manually on Windows, recording (not enforcing) the checksum instead.
      - name: Download Windows nightly SDK
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          version='${{ needs.nightly.outputs.version }}'
          url="https://gitcode.com/Cangjie/nightly_build/releases/download/${version}/cangjie-sdk-windows-x64-${version}.zip"
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 \
            -o "$RUNNER_TEMP/cangjie-nightly.zip" "$url"
      - name: Install Windows nightly SDK
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cangjie-sdk'
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          tar -xf (Join-Path $env:RUNNER_TEMP 'cangjie-nightly.zip') -C $sdkRoot
          $cjBase = Join-Path $sdkRoot 'cangjie'
          if (-not (Test-Path (Join-Path $cjBase 'envsetup.ps1'))) { throw "envsetup.ps1 not found under $cjBase" }
          Set-Location $cjBase
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          . (Join-Path $cjBase 'envsetup.ps1')
          $skip = @('PWD','OLDPWD','SHLVL','_','PROMPT','PATHEXT','PSModulePath','COMSPEC','__COMPAT_LAYER','PSExecutionPolicyPreference','POWERSHELL_UPDATECHECK')
          foreach ($kv in (Get-ChildItem Env:)) {
            if ($kv.Name -in @('PATH','Path') -or $kv.Name -in $skip) { continue }
            $old = if ($before.ContainsKey($kv.Name)) { $before[$kv.Name] } else { $null }
            if ($old -ne $kv.Value) { Add-Content -Path $env:GITHUB_ENV -Value "$($kv.Name)=$($kv.Value)" }
          }
          $beforePath = @()
          foreach ($k in @('PATH','Path')) { if ($before.ContainsKey($k)) { $beforePath += ($before[$k] -split ';') } }
          $env:Path -split ';' | Where-Object { $_ -and ($beforePath -notcontains $_) } | ForEach-Object {
            Add-Content -Path $env:GITHUB_PATH -Value $_
          }
          cjc -v
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.nightly.outputs.version }} resolution=${{ needs.nightly.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          ${{ matrix.checksum }} "$RUNNER_TEMP/${{ matrix.archive }}"
      - name: Run Pure package gates
        env:
          # The pinned nightly's LLVM llc also crashes at -O2 in macOS Pure;
          # Windows already uses -O1 for the same pinned-SDK issue.
          YJSON_CI_DEPENDENCY_OVERRIDE: ${{ contains(fromJSON('["windows-2022","macos-14"]'), matrix.os) && '-O1' || '' }}
        run: scripts/ci_job.sh pure-platform

  api-docs:
    name: API Documentation
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ needs.nightly.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie-nightly.tar.gz
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.nightly.outputs.version }} resolution=${{ needs.nightly.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          sha256sum "$RUNNER_TEMP/cangjie-nightly.tar.gz"
      - name: Generate source-qualified cjdoc site
        env:
          YJSON_RESOLVED_NIGHTLY: ${{ needs.nightly.outputs.version }}
          YJSON_API_DOCS_OUTPUT: target/api-docs
        run: |
          ulimit -s 131072
          scripts/ci_job.sh api-docs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload API documentation
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: target/api-docs

  pages:
    name: Deploy API Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-docs, ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check deployment still targets main HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded documentation for $GITHUB_SHA; main=$latest"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  coverage:
    name: Core Coverage
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ needs.nightly.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie-nightly.tar.gz
      - name: Record toolchain
        run: |
          echo "resolved_cangjie_version=${{ needs.nightly.outputs.version }} resolution=${{ needs.nightly.outputs.resolution }}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm --version
          sha256sum "$RUNNER_TEMP/cangjie-nightly.tar.gz"
      - name: Generate cjcov and LCOV reports
        run: scripts/coverage.sh
      - name: Detect established coverage baseline
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git show "$BASE_SHA:coverage-baseline.toml" >/dev/null 2>&1; then
            echo "enforce_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "enforce_patch=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap release: base branch has no coverage baseline; project gates remain blocking."
          fi
      - name: Verify patch line and branch coverage
        if: github.event_name == 'pull_request' && steps.baseline.outputs.enforce_patch == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --unified=0 "$BASE_SHA"...HEAD -- 'src/lib_*.cj' ':(exclude)src/lib_json_native_scanner.cj' > coverage/patch.diff
          python3 scripts/check_patch_coverage.py \
            --diff coverage/patch.diff \
            --lcov coverage/lcov.info \
            --baseline coverage-baseline.toml
      - name: Upload core coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: core
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      # Per-package flags mirror codecov.yml. The lcov files are produced when
      # the package coverage collector lands in scripts/coverage.sh; each
      # upload activates the corresponding project and patch gates in
      # codecov.yml. Until a file exists the step is skipped and the flag is
      # simply not reported.
      - name: Upload algorithms coverage to Codecov
        if: hashFiles('coverage/lcov.algorithms.info') != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          files: coverage/lcov.algorithms.info
          flags: algorithms
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      - name: Upload native coverage to Codecov
        if: hashFiles('coverage/lcov.native.info') != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          files: coverage/lcov.native.info
          flags: native
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      - name: Upload yyjson coverage to Codecov
        if: hashFiles('coverage/lcov.yyjson.info') != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          files: coverage/lcov.yyjson.info
          flags: yyjson
          disable_search: true
          fail_ci_if_error: true
          verbose: true
      - name: Upload schema-formats coverage to Codecov
        if: hashFiles('coverage/lcov.schema-formats.info') != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          files: coverage/lcov.schema-formats.info
          flags: schema-formats
          disable_search: true
          fail_ci_if_error: true
          verbose: true


  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - ci-guardrails
      - generated-change-risk
      - perf-evidence-drift
      - stream-docs
      - nightly
      - tests
      - pure-platforms
      - api-docs
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every quality gate to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {
              "ci-guardrails", "generated-change-risk", "perf-evidence-drift",
              "stream-docs", "nightly", "tests", "pure-platforms", "api-docs", "coverage",
          }
          results = json.loads(os.environ["NEEDS_JSON"])
          if not isinstance(results, dict) or set(results) != expected:
              raise SystemExit("CI dependency inventory is missing or unexpected")
          failed = {
              name: value.get("result") if isinstance(value, dict) else None
              for name, value in results.items()
              if not isinstance(value, dict) or value.get("result") != "success"
          }
          if failed:
              raise SystemExit("CI quality gates did not succeed: " + json.dumps(failed, sort_keys=True))
          print("All required CI quality gates succeeded")
          PY
