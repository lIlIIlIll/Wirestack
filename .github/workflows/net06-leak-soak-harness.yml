name: NET-06 Leak and Soak Harness

on:
  pull_request:
    paths:
      - "tools/gates/net06_leak_soak.py"
      - "tools/gates/net06_leak_soak_sources.py"
      - "tools/gates/net06_tls_failure_cleanup.py"
      - "tools/gates/tests/test_net06_leak_soak.py"
      - "tools/gates/tests/test_net06_tls_failure_cleanup.py"
      - "tools/tls_provider_poc/openssl_memory_poc.c"
      - "tools/tls_provider_poc/run.py"
      - "scripts/gate-net06-leak-soak"
      - "scripts/gate-net06-tls-failure-cleanup"
      - ".github/workflows/net06-leak-soak-harness.yml"
  push:
    branches: [main]
    paths:
      - "tools/gates/net06_leak_soak.py"
      - "tools/gates/net06_leak_soak_sources.py"
      - "tools/gates/net06_tls_failure_cleanup.py"
      - "tools/gates/tests/test_net06_leak_soak.py"
      - "tools/gates/tests/test_net06_tls_failure_cleanup.py"
      - "tools/tls_provider_poc/openssl_memory_poc.c"
      - "tools/tls_provider_poc/run.py"
      - "scripts/gate-net06-leak-soak"
      - "scripts/gate-net06-tls-failure-cleanup"
      - ".github/workflows/net06-leak-soak-harness.yml"

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test NET-06 harness
        run: python3 -m unittest discover -s tools/gates/tests -p 'test_net06*.py' -v
      - name: Compile harness
        run: >-
          python3 -m py_compile
          tools/gates/net06_leak_soak.py
          tools/gates/net06_leak_soak_sources.py
          tools/gates/net06_tls_failure_cleanup.py
