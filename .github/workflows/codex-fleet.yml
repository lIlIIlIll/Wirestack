name: Codex Fleet Planner

on:
  pull_request:
    paths:
      - "tools/codex_fleet.py"
      - "tools/codex_fleet_core.py"
      - "tools/tests/test_codex_fleet.py"
      - "scripts/codex-fleet"
      - "scripts/with-host-gate-lock"
      - "docs/planning/fleet-state.json"
      - "docs/planning/parallel-execution.md"
      - ".github/workflows/codex-fleet.yml"
  push:
    branches: [main]
    paths:
      - "tools/codex_fleet.py"
      - "tools/codex_fleet_core.py"
      - "tools/tests/test_codex_fleet.py"
      - "scripts/codex-fleet"
      - "scripts/with-host-gate-lock"
      - "docs/planning/fleet-state.json"
      - "docs/planning/parallel-execution.md"
      - ".github/workflows/codex-fleet.yml"

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_codex_fleet.py' -v
      - name: Compile planner
        run: python3 -m py_compile tools/codex_fleet.py tools/codex_fleet_core.py
      - name: Validate current READY wave
        shell: bash
        run: |
          scripts/codex-fleet plan > fleet-plan.txt
          cat fleet-plan.txt
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from codex_fleet_core import (
              completed_ids,
              load_state,
              parse_backlog,
              ready_tasks,
          )

          root = Path.cwd()
          tasks = parse_backlog(root / "docs/planning/implementation-backlog.md")
          state = load_state(root / "docs/planning/fleet-state.json")
          maximum = int(state.get("max_parallel", 8))
          expected = [task.task_id for task in ready_tasks(tasks, state)[:maximum]]
          actual = [
              line.split("\t", 1)[0]
              for line in (root / "fleet-plan.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if actual != expected:
              raise SystemExit(f"READY wave mismatch: expected={expected}, actual={actual}")
          overlap = completed_ids(state).intersection(actual)
          if overlap:
              raise SystemExit(f"completed tasks reappeared in READY wave: {sorted(overlap)}")
          if len(actual) > maximum:
              raise SystemExit(f"READY wave exceeds max_parallel={maximum}: {actual}")
          print(f"validated READY wave ({len(actual)} tasks): {', '.join(actual)}")
          PY
