name: TLS Provider PoC

on:
  pull_request:
    paths:
      - "tools/tls_provider_poc/**"
      - "tools/tests/test_tls_provider_poc*.py"
      - "docs/architecture/tls-provider-poc-contract.md"
      - "docs/evidence/M0-016/**"
      - "scripts/tls-provider-poc"
      - ".github/workflows/tls-provider-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider pins and platform matrix
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --matrix docs/evidence/M0-016/platform-matrix.json
      - name: Run fail-closed validator tests
        run: python3 -m unittest discover -s tools/tests -p 'test_tls_provider_poc*.py' -v
      - name: Compile Python tools
        run: |
          python3 -m py_compile \
            tools/tls_provider_poc/run.py \
            tools/tls_provider_poc/run_musl.py \
            tools/tls_provider_poc/run_windows.py \
            tools/tls_provider_poc/validate.py

  linux-glibc:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl git openssl ca-certificates
      - name: Build pinned provider and execute caller-driven PoC
        run: |
          python3 tools/tls_provider_poc/run.py \
            --provider "${{ matrix.provider }}" \
            --output "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - name: Validate native result
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --result "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-linux-glibc-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
          if-no-files-found: warn

  linux-musl:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute in native Alpine musl userspace
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          docker run --rm \
            -e PROVIDER \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            alpine:3.22 \
            sh -euxc '
              output="build/tls-provider-poc/$PROVIDER"
              trap '\''test ! -e "$output" || chmod -R a+rX "$output"'\'' EXIT
              apk add --no-cache \
                build-base cmake ninja perl git openssl ca-certificates python3 linux-headers
              python3 tools/tls_provider_poc/run_musl.py \
                --provider "$PROVIDER" \
                --output "$output/result.json"
              python3 tools/tls_provider_poc/validate.py \
                --result "$output/result.json"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-linux-musl-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
          if-no-files-found: warn

  macos-arm64:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: brew install cmake ninja openssl@3
      - name: Build pinned provider and execute caller-driven PoC
        env:
          PATH: /opt/homebrew/opt/openssl@3/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          test "$(uname -m)" = "arm64"
          python3 tools/tls_provider_poc/run.py \
            --provider "${{ matrix.provider }}" \
            --output "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - name: Validate native result
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --result "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-macos-arm64-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
          if-no-files-found: warn

  windows-x86_64:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            perl
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-python
      - name: Build pinned provider and execute native Windows PoC
        shell: msys2 {0}
        env:
          PROVIDER: ${{ matrix.provider }}
          CC: gcc
          CXX: g++
        run: |
          python tools/tls_provider_poc/run_windows.py \
            --provider "$PROVIDER" \
            --output "build/tls-provider-poc/$PROVIDER/result.json"
      - name: Validate native result
        shell: msys2 {0}
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python tools/tls_provider_poc/validate.py \
            --result "build/tls-provider-poc/$PROVIDER/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-windows-x86_64-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
          if-no-files-found: warn
