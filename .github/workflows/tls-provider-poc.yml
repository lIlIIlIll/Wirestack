name: TLS Provider PoC

on:
  pull_request:
    paths:
      - "tools/tls_provider_poc/**"
      - "tools/tests/test_tls_provider_poc.py"
      - "docs/architecture/tls-provider-poc-contract.md"
      - "docs/evidence/M0-016/**"
      - "scripts/tls-provider-poc"
      - ".github/workflows/tls-provider-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider pins and platform matrix
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --matrix docs/evidence/M0-016/platform-matrix.json
      - name: Run fail-closed validator tests
        run: python3 -m unittest discover -s tools/tests -p 'test_tls_provider_poc.py' -v
      - name: Compile Python tools
        run: |
          python3 -m py_compile \
            tools/tls_provider_poc/run.py \
            tools/tls_provider_poc/run_musl.py \
            tools/tls_provider_poc/validate.py

  linux-glibc:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl git openssl ca-certificates
      - name: Build pinned provider and execute caller-driven PoC
        env:
          WIRESTACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/tls_provider_poc/run.py \
            --provider "${{ matrix.provider }}" \
            --output "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - name: Validate native result
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --result "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-linux-glibc-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
            build/tls-provider-poc/${{ matrix.provider }}/license-bundle
          if-no-files-found: warn

  linux-musl:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Provision native Alpine musl userspace
        env:
          PROVIDER: ${{ matrix.provider }}
          ALPINE_IMAGE: alpine:3.22@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          CONTAINER_NAME: wirestack-m0-016-${{ matrix.provider }}-${{ github.run_id }}
        run: |
          docker run --detach \
            --name "$CONTAINER_NAME" \
            -e PROVIDER \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e ImageOS=alpine \
            -e ImageVersion=3.22.5 \
            -e WIRESTACK_CONTAINER_IMAGE="$ALPINE_IMAGE" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$ALPINE_IMAGE" \
            sh -c 'while :; do sleep 3600; done'
          docker exec "$CONTAINER_NAME" apk add --no-cache \
            build-base cmake ninja perl git openssl ca-certificates python3 linux-headers
          docker exec "$CONTAINER_NAME" \
            git config --global --add safe.directory /work
      - name: Build and execute in provisioned Alpine musl userspace
        env:
          PROVIDER: ${{ matrix.provider }}
          CONTAINER_NAME: wirestack-m0-016-${{ matrix.provider }}-${{ github.run_id }}
          WIRESTACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker exec \
            -e WIRESTACK_GITHUB_TOKEN \
            "$CONTAINER_NAME" \
            sh -euxc '
              output="build/tls-provider-poc/$PROVIDER"
              trap '\''test ! -e "$output" || chmod -R a+rX "$output"'\'' EXIT
              python3 tools/tls_provider_poc/run_musl.py \
                --provider "$PROVIDER" \
                --output "$output/result.json"
              unset WIRESTACK_GITHUB_TOKEN
              python3 tools/tls_provider_poc/validate.py \
                --result "$output/result.json"
            '
      - name: Remove Alpine musl container
        if: always()
        env:
          CONTAINER_NAME: wirestack-m0-016-${{ matrix.provider }}-${{ github.run_id }}
        run: docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-linux-musl-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
            build/tls-provider-poc/${{ matrix.provider }}/license-bundle
          if-no-files-found: warn

  macos-arm64:
    needs: validate-contract
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc, mbedtls, openssl]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: brew install cmake ninja openssl@3
      - name: Build pinned provider and execute caller-driven PoC
        env:
          PATH: /opt/homebrew/opt/openssl@3/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          WIRESTACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = "arm64"
          python3 tools/tls_provider_poc/run.py \
            --provider "${{ matrix.provider }}" \
            --output "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - name: Validate native result
        run: |
          python3 tools/tls_provider_poc/validate.py \
            --result "build/tls-provider-poc/${{ matrix.provider }}/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-016-macos-arm64-${{ matrix.provider }}
          path: |
            build/tls-provider-poc/${{ matrix.provider }}/result.json
            build/tls-provider-poc/${{ matrix.provider }}/build.log
            build/tls-provider-poc/${{ matrix.provider }}/license-bundle
          if-no-files-found: warn
