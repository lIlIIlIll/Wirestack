name: Clean Cangjie Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clean-cangjie-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-cangjie-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out a clean source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 1

      - name: Install the pinned Cangjie toolchain
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: "1.1.0-alpha.20260817040003"
          archive-path: ${{ runner.temp }}/cangjie.tar.gz

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build

      - name: Verify Linux toolchain readiness
        run: scripts/repo-doctor --json

      - name: Run canonical build and test gate
        run: scripts/check

      - name: Build and run the installed public consumer
        run: scripts/check-m7-027-linux-examples --json

      - name: Reject stale task evidence
        run: scripts/verify-evidence --all --json

      - name: Reject build-time source-tree mutation
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
