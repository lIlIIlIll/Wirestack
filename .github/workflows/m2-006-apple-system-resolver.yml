name: M2-006 Apple SystemResolver (desktop STS only)

on:
  push:
    branches:
      - fix/M2-006-sts-requalification
    paths:
      - ".gitignore"
      - "build.cj"
      - "cjpm.toml"
      - "docs/evidence/M2-006/**"
      - "!docs/evidence/M2-006/current-desktop/**"
      - "docs/references/m2-006-sts-sdk.json"
      - "native/resolver/apple/**"
      - "native/resolver/linux/**"
      - "src/**"
      - "tools/build_apple_resolver.py"
      - "tools/build_native_dependencies.py"
      - "tools/build_resolver.py"
      - "tools/evidence_digest.py"
      - "tools/gates/m2_006_apple_resolver.py"
      - "tools/gates/sts_sdk_identity.py"
      - "tools/gates/native/m2_006_tls_link_stub.c"
      - "tools/gates/probes/m2_006_apple_resolver.cj"
      - "tools/gates/tests/test_m2_006_apple_resolver.py"
      - "tools/gates/tests/test_sts_sdk_identity.py"
      - "tools/tasks/M2-006.json"
      - ".github/workflows/m2-006-apple-system-resolver.yml"
      - "tools/tests/test_build_apple_resolver.py"
      - "tools/tests/test_build_resolver.py"
      - "tools/tests/test_m7_029_independent_security_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos-resolver:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1

      - name: Install the official pinned macOS STS 1.2.0 SDK
        shell: bash
        run: |
          archive_name="$(python3 -c 'import json; print(json.load(open("docs/references/m2-006-sts-sdk.json", encoding="utf-8"))["archive"]["name"])')"
          archive_url="$(python3 -c 'import json; print(json.load(open("docs/references/m2-006-sts-sdk.json", encoding="utf-8"))["archive"]["url"])')"
          archive="$RUNNER_TEMP/$archive_name"
          extract_root="$RUNNER_TEMP/m2-006-sdk"
          curl --fail --location --retry 3 --silent --show-error "$archive_url" --output "$archive"
          python3 - "$archive" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools import evidence_digest

          pin = json.loads(
              Path("docs/references/m2-006-sts-sdk.json").read_text(encoding="utf-8")
          )
          archive_pin = pin["archive"]
          archive_path = Path(sys.argv[1])
          expected_size = archive_pin["size_bytes"]
          if type(expected_size) is not int or archive_path.stat().st_size != expected_size:
              raise SystemExit("STS SDK archive size does not match its pin")
          actual_digest = evidence_digest.artifact_byte_digest(archive_path)
          if not evidence_digest.schema_artifact_sha256_equal(
              actual_digest.sha256, archive_pin["sha256"]
          ):
              raise SystemExit("STS SDK archive bytes do not match its pin")
          PY
          mkdir -p "$extract_root"
          tar -xzf "$archive" -C "$extract_root"
          sdk_root="$extract_root/cangjie"
          test -f "$sdk_root/envsetup.sh"
          test -x "$sdk_root/bin/cjc"
          source "$sdk_root/envsetup.sh"
          cjc -v
          cjpm --version
          echo "CANGJIE_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "CANGJIE_SDK_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Validate task tooling
        shell: bash
        run: |
          source "$CANGJIE_HOME/envsetup.sh"
          python3 -m unittest \
            tools.tests.test_build_resolver \
            tools.tests.test_build_apple_resolver \
            tools.gates.tests.test_m2_006_apple_resolver \
            tools.gates.tests.test_sts_sdk_identity -v
          python3 tools/repository/repository_tooling.py --root . validate-plan docs/evidence/M2-006/test-plan.md --json

      - name: Run native macOS resolver acceptance
        shell: bash
        run: |
          source "$CANGJIE_HOME/envsetup.sh"
          python3 tools/gates/m2_006_apple_resolver.py \
            --repo-root . \
            --mode macos \
            --revision "$GITHUB_SHA" \
            --output docs/evidence/M2-006/current-desktop/macos-arm64/report.json

      - name: Validate exact-revision current desktop report
        shell: bash
        run: |
          source "$CANGJIE_HOME/envsetup.sh"
          python3 tools/gates/m2_006_apple_resolver.py \
            --repo-root . \
            --validate-report docs/evidence/M2-006/current-desktop/macos-arm64/report.json \
            --expected-revision "$GITHUB_SHA" \
            --expected-mode macos \
            --validation-output docs/evidence/M2-006/current-desktop/macos-arm64/validation.json

      - name: Upload current native macOS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-006-macos-arm64-sts-1.2.0-${{ github.sha }}
          path: docs/evidence/M2-006/current-desktop/macos-arm64
          if-no-files-found: error
          retention-days: 14
