name: Raw TCP Baseline Harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test raw TCP baseline harness
        run: python3 -m unittest discover -s tools/benchmarks/tests -p 'test_raw_tcp_stdnet.py' -v
