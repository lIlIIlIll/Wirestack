name: M7-033 Developer Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: m7-033-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-cjdoc:
    name: Build cjdoc 0.7.2 / Cangjie 1.1 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the cjdoc build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 1

      - name: Install the cjdoc-compatible Cangjie toolchain
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: 1.1.0-alpha.20260414010024

      - name: Install native prerequisites for cjdoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm cmake ninja-build

      - name: Build the pinned cjdoc 0.7.2 source
        env:
          CJDOC_VERSION: 0.7.2
          CJDOC_REPOSITORY: lIlIIlIll/cjdoc
          CJDOC_SOURCE_SHA: e966097a3591538fba8990772e2e6c543de86c21
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/cjdoc-source"
          install_dir="$RUNNER_TEMP/cjdoc"
          archive="$RUNNER_TEMP/cjdoc-source.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            "https://codeload.github.com/${CJDOC_REPOSITORY}/tar.gz/${CJDOC_SOURCE_SHA}" \
            --output "$archive"
          mkdir -p "$source_dir"
          tar --extract --gzip --file "$archive" --directory "$source_dir" --strip-components=1
          test -f "$source_dir/cjpm.toml"
          python3 - "$source_dir/cjpm.toml" <<'PY'
          from pathlib import Path
          import sys

          config = Path(sys.argv[1])
          text = config.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines) if line.strip() == 'compile-option = ""']
          if len(matches) != 1:
              raise SystemExit("unexpected cjdoc compile-option schema")
          index = matches[0]
          lines[index] = lines[index].replace('compile-option = ""', 'compile-option = "-O0"', 1)
          config.write_text("".join(lines), encoding="utf-8")
          PY
          (cd "$source_dir" && cjpm update --skip-script)
          python3 - "$HOME/.cjpm/git/markdown/db4f9527944b589db8436669f1d255192388cee2/cjpm.toml" \
            "$HOME/.cjpm/git/yjson/bf65cbecd99ac25e7485f8db60990e94a04e57bc/cjpm.toml" <<'PY'
          from pathlib import Path
          import sys

          for raw_path in sys.argv[1:]:
              path = Path(raw_path)
              if not path.is_file():
                  raise SystemExit(f"missing pinned dependency manifest: {path}")
              text = path.read_text(encoding="utf-8")
              count = text.count('compile-option = "-O2"')
              if count == 0:
                  raise SystemExit(f"pinned dependency has no expected optimizer keys: {path}")
              path.write_text(text.replace('compile-option = "-O2"', 'compile-option = "-O0"'), encoding="utf-8")
          PY
          (cd "$source_dir" && cjpm build)
          mkdir -p "$install_dir/bin"
          binary="$install_dir/bin/cjdoc"
          cp "$source_dir/target/release/bin/main" "$binary"
          test -x "$binary"
          "$binary" --version
          tar --create --gzip --file "$RUNNER_TEMP/cjdoc.tar.gz" \
            --directory "$install_dir" bin/cjdoc

      - name: Upload the pinned cjdoc binary
        uses: actions/upload-artifact@v4
        with:
          name: m7-033-cjdoc-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/cjdoc.tar.gz

  generate:
    name: Generate public API docs / cjdoc 0.7.2
    needs: build-cjdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve the Cangjie toolchain
        id: cangjie-nightly
        run: python3 tools/latest_cangjie_nightly.py --github-output "$GITHUB_OUTPUT"

      - name: Install the Cangjie toolchain
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: nightly
          version: ${{ steps.cangjie-nightly.outputs.version }}
          archive-path: ${{ runner.temp }}/cangjie.tar.gz

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm cmake ninja-build

      - name: Download the pinned cjdoc binary
        uses: actions/download-artifact@v4
        with:
          name: m7-033-cjdoc-${{ github.sha }}
          path: ${{ runner.temp }}/cjdoc-archive

      - name: Install the pinned cjdoc binary
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/cjdoc"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$RUNNER_TEMP/cjdoc-archive/cjdoc.tar.gz" \
            --directory "$install_dir"
          binary="$install_dir/bin/cjdoc"
          chmod +x "$binary"
          test -x "$binary"
          "$binary" --version

      - name: Run the strict documentation and coverage gate
        env:
          CJDOC_BIN: ${{ runner.temp }}/cjdoc/bin/cjdoc
        run: scripts/check-docs --html --json

      - name: Build and run the public clean consumer
        run: scripts/check-m7-027-linux-examples --json

      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-033-docs-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/evidence/M7-033/docs-report.json
            target/doc/html

      - name: Upload the Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc/html

  deploy:
    name: Deploy latest main documentation
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the generated Pages evidence
        uses: actions/download-artifact@v4
        with:
          name: m7-033-docs-${{ github.sha }}
          path: ${{ runner.temp }}/m7-033-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test root, API page and search index
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --max-time 10 "$root" >/dev/null
          curl --fail --silent --show-error --location --max-time 10 "${root}index.html" >/dev/null
          curl --fail --silent --show-error --location --max-time 10 "${root}search-index.js" >/dev/null
          api_path=$(jq -r '[.combined.htmlPages[] | select(startswith("packages/"))][0] // empty' \
            "$RUNNER_TEMP/m7-033-docs/docs/evidence/M7-033/docs-report.json")
          test -n "$api_path"
          curl --fail --silent --show-error --location --max-time 10 "${root}${api_path}" >/dev/null
