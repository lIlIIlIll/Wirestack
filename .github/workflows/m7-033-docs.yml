name: M7-033 Developer Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: m7-033-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANGJIE_CHANNEL: sts
  CANGJIE_VERSION: "1.1.3"
  CJV_VERSION: "v0.2.21"

jobs:
  build-cjdoc:
    name: Build pinned cjdoc 0.7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the cjdoc build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1

      - name: Install the pinned Cangjie toolchain
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: ${{ env.CANGJIE_CHANNEL }}
          version: ${{ env.CANGJIE_VERSION }}
          cjv-version: ${{ env.CJV_VERSION }}

      - name: Install native prerequisites for cjdoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm cmake ninja-build

      - name: Build the pinned cjdoc 0.7.2 source
        env:
          CJDOC_VERSION: 0.7.2
          CJDOC_REPOSITORY: lIlIIlIll/cjdoc
          CJDOC_SOURCE_SHA: 582a95278c95024dc2cf3dfe9f011259c1002fc2
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/cjdoc-source"
          install_dir="$RUNNER_TEMP/cjdoc"
          archive="$RUNNER_TEMP/cjdoc-source.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            "https://codeload.github.com/${CJDOC_REPOSITORY}/tar.gz/${CJDOC_SOURCE_SHA}" \
            --output "$archive"
          mkdir -p "$source_dir"
          tar --extract --gzip --file "$archive" --directory "$source_dir" --strip-components=1
          test -f "$source_dir/cjpm.toml"
          python3 - "$source_dir/cjpm.toml" <<'PY'
          from pathlib import Path
          import sys

          config = Path(sys.argv[1])
          text = config.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines) if line.strip() == 'compile-option = ""']
          if len(matches) != 1:
              raise SystemExit("unexpected cjdoc compile-option schema")
          index = matches[0]
          lines[index] = lines[index].replace('compile-option = ""', 'compile-option = "-O0"', 1)
          config.write_text("".join(lines), encoding="utf-8")
          PY
          python3 - "$source_dir/cjpm.toml" "$source_dir/vendor/yjson_algorithms/cjpm.toml" <<'PY'
          from pathlib import Path
          import re
          import sys

          for raw_path in sys.argv[1:]:
              config = Path(raw_path)
              text = config.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              matches = [index for index, line in enumerate(lines) if line.strip().startswith('"yjson" = { git =') or line.strip().startswith('yjson = { git =')]
              if len(matches) != 1 or 'commitId = ' not in lines[matches[0]]:
                  raise SystemExit(f"unexpected yjson dependency schema: {config}")
              index = matches[0]
              lines[index] = re.sub(r'commitId = "[^"]+"', 'tag = "0.1.0"', lines[index], count=1)
              config.write_text("".join(lines), encoding="utf-8")
          PY
          yjson_source_sha="54b4965dee0f0b96710cbc678ec5ec9a126b055c"
          yjson_archive="$RUNNER_TEMP/yjson-release-0.1.0.tar.gz"
          yjson_dir="$RUNNER_TEMP/yjson-release-0.1.0"
          curl --fail --silent --show-error --location --max-time 180 \
            "https://codeload.github.com/lIlIIlIll/yjson/tar.gz/$yjson_source_sha" \
            --output "$yjson_archive"
          mkdir -p "$yjson_dir"
          tar --extract --gzip --file "$yjson_archive" --directory "$yjson_dir" --strip-components=1
          for file in lib_json_patch.cj lib_json_path.cj lib_json_pointer.cj lib_json_schema.cj linear_regex.cj work_limits.cj; do
            test -f "$yjson_dir/packages/yjson_algorithms/src/$file"
            cp "$yjson_dir/packages/yjson_algorithms/src/$file" "$source_dir/vendor/yjson_algorithms/src/$file"
          done
          python3 - "$source_dir/src/output_manifest.cj" "$source_dir/src/schema_data/schema_v8.cj" "$source_dir/src/render/json_decode_primitives.cj" <<'PY'
          from pathlib import Path
          import sys

          output_manifest, schema_v8, decoder = map(Path, sys.argv[1:])
          text = output_manifest.read_text(encoding="utf-8")
          anchor = "import yjson.*\n\n"
          helper = """private func jsonArrayValues(value: JsonArray): Array<JsonNode> {
              let result = ArrayList<JsonNode>()
              for (index in 0..value.size()) {
                  result.add(value.get(index).getOrThrow())
              }
              result.toArray()
          }

          """
          if text.count(anchor) != 1 or "private func jsonArrayValues" in text:
              raise SystemExit("unexpected output manifest schema")
          output_manifest.write_text(text.replace(anchor, anchor + helper, 1), encoding="utf-8")

          lines = schema_v8.read_text(encoding="utf-8").splitlines(keepends=True)
          starts = [index for index, line in enumerate(lines)
                    if ".replace(" in line and "portablePath" in line
                    and index + 1 < len(lines) and "^(?!/)" in lines[index + 1]]
          if len(starts) != 1:
              raise SystemExit(f"unexpected schema v8 portable path patch count: {starts}")
          index = starts[0]
          if index + 4 >= len(lines) or "^(?![A-Za-z]:)" not in lines[index + 3] or "(?!.*/" not in lines[index + 4]:
              raise SystemExit("unexpected schema v8 portable path pattern")
          replacement = '            "\\"pattern\\": \\"^[^/]+(?:/[^/]+)*$\\"}")\n'
          lines[index + 3:index + 5] = [replacement]
          schema_v8.write_text("".join(lines), encoding="utf-8")

          lines = decoder.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines)
                     if "maxRefResolutions: DOC_IR_SCHEMA_MAX_WORK," in line]
          if len(matches) != 1 or "maxRegexSteps" in lines[matches[0]]:
              raise SystemExit("unexpected decoder schema budget")
          index = matches[0]
          lines[index] = lines[index].replace(
              "maxRefResolutions: DOC_IR_SCHEMA_MAX_WORK,",
              "maxRefResolutions: DOC_IR_SCHEMA_MAX_WORK, maxRegexSteps: DOC_IR_SCHEMA_MAX_WORK,",
              1)
          decoder.write_text("".join(lines), encoding="utf-8")
          PY
          (cd "$source_dir" && cjpm update --skip-script)
          python3 - "$HOME/.cjpm/git/markdown/db4f9527944b589db8436669f1d255192388cee2/cjpm.toml" \
            "$HOME/.cjpm/git/yjson/c91859feb77aeba392a1fad0f99d731df66be831/cjpm.toml" <<'PY'
          from pathlib import Path
          import sys

          for raw_path in sys.argv[1:]:
              path = Path(raw_path)
              if not path.is_file():
                  raise SystemExit(f"missing pinned dependency manifest: {path}")
              text = path.read_text(encoding="utf-8")
              if path.parts[-2] == "c91859feb77aeba392a1fad0f99d731df66be831" and 'version = "0.1.0"' not in text:
                  raise SystemExit(f"resolved yjson dependency is not release 0.1.0: {path}")
              count = text.count('compile-option = "-O2"')
              if count == 0:
                  raise SystemExit(f"pinned dependency has no expected optimizer keys: {path}")
              path.write_text(text.replace('compile-option = "-O2"', 'compile-option = "-O0"'), encoding="utf-8")
          PY
          (cd "$source_dir" && cjpm build)
          mkdir -p "$install_dir/bin"
          binary="$install_dir/bin/cjdoc"
          cp "$source_dir/target/release/bin/main" "$binary"
          test -x "$binary"
          "$binary" --version
          tar --create --gzip --file "$RUNNER_TEMP/cjdoc.tar.gz" \
            --directory "$install_dir" bin/cjdoc

      - name: Upload the pinned cjdoc binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m7-033-cjdoc-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/cjdoc.tar.gz

  generate:
    name: Generate public API docs / cjdoc 0.7.2
    needs: build-cjdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1

      - name: Install the pinned Cangjie toolchain
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: ${{ env.CANGJIE_CHANNEL }}
          version: ${{ env.CANGJIE_VERSION }}
          cjv-version: ${{ env.CJV_VERSION }}

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm cmake ninja-build

      - name: Download the pinned cjdoc binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m7-033-cjdoc-${{ github.sha }}
          path: ${{ runner.temp }}/cjdoc-archive

      - name: Install the pinned cjdoc binary
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/cjdoc"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$RUNNER_TEMP/cjdoc-archive/cjdoc.tar.gz" \
            --directory "$install_dir"
          binary="$install_dir/bin/cjdoc"
          chmod +x "$binary"
          test -x "$binary"
          "$binary" --version
          echo "CJDOC_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run the strict documentation and coverage gate
        run: scripts/check-docs --html --json

      - name: Materialize native dependencies for the clean consumer
        run: |
          python3 tools/build_linux_tls_provider.py
          python3 tools/build_linux_resolver.py --quiet

      - name: Build and run the public clean consumer
        run: scripts/check-m7-027-linux-examples --json

      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m7-033-docs-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/evidence/M7-033/docs-report.json
            target/doc/html

      - name: Upload the Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc/html

  report-docs-status:
    if: ${{ always() }}
    needs: [build-cjdoc, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require documentation prerequisites to succeed
        env:
          CJDOC_RESULT: ${{ needs.build-cjdoc.result }}
          DOCS_RESULT: ${{ needs.generate.result }}
        run: test "$CJDOC_RESULT" = success && test "$DOCS_RESULT" = success

  deploy:
    name: Deploy latest main documentation
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the generated Pages evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m7-033-docs-${{ github.sha }}
          path: ${{ runner.temp }}/m7-033-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke-test root, API page and search index
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import subprocess

          root = os.environ["PAGE_URL"].rstrip("/") + "/"
          temporary_root = Path(os.environ["RUNNER_TEMP"])
          docs = json.loads((temporary_root / "m7-033-docs/docs/evidence/M7-033/docs-report.json").read_text(encoding="utf-8"))
          api_path = next(path for path in docs["combined"]["htmlPages"] if path.startswith("packages/"))
          checks = []
          for path in ("", "index.html", "search-index.js", api_path):
              result = subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--location",
                   "--max-time", "10", "--output", "/dev/null", "--write-out",
                   "%{http_code}", root + path],
                  check=True, stdout=subprocess.PIPE, text=True,
              )
              status = int(result.stdout)
              if status != 200:
                  raise SystemExit(f"unexpected HTTP status {status}: {root + path}")
              checks.append({"path": "/" + path, "http_status": status})
          report = {
              "schema_version": 1,
              "kind": "github-pages-smoke",
              "status": "PASS",
              "source_task": "M7-033",
              "acceptance_status": "PASS",
              "revision": os.environ["GITHUB_SHA"],
              "workflow": {
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "event": os.environ["GITHUB_EVENT_NAME"],
                  "head_sha": os.environ["GITHUB_SHA"],
              },
              "page_url": root,
              "checks": checks,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          output = temporary_root / "m7-033-pages-smoke.json"
          temporary = output.with_suffix(".tmp")
          temporary.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          temporary.replace(output)
          PY

      - name: Upload revision-bound Pages smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m7-033-pages-smoke-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/m7-033-pages-smoke.json
