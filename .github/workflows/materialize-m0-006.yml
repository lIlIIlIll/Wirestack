name: Materialize M0-006 payload

on:
  push:
    branches:
      - task/M0-006-close-wakeup-gate
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: task/M0-006-close-wakeup-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/m0-006-part-* | base64 --decode > /tmp/m0-006-payload.tar.gz
          echo "fa0740e462e5b08a9bc633b60d75b2f98820cf9d8d0ae3b2e3b7fa7613377d6d  /tmp/m0-006-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/m0-006-payload.tar.gz -C .
          rm -rf .automation .github/workflows/materialize-m0-006.yml
          chmod +x scripts/gate-net01-close-wakeup
      - name: Verify generated change
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/gates/tests -p 'test_net01_close_wakeup.py' -v
          python3 -m py_compile tools/gates/net01_close_wakeup.py
          python3 tools/architecture_guard.py --root . --format text
      - name: Commit materialized task
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M0-006: execute GATE-NET-01 close/wakeup probes"
          git push origin HEAD:task/M0-006-close-wakeup-gate
