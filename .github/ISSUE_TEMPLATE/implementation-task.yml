name: Wirestack implementation task
description: Execute one task from the Wirestack implementation backlog.
title: "[TASK-ID] "
labels: []
body:
  - type: input
    id: task
    attributes:
      label: Task ID
      description: Exact ID from docs/planning/implementation-backlog.md
      placeholder: M0-001
    validations:
      required: true

  - type: textarea
    id: prd
    attributes:
      label: PRD and dependency references
      description: PRD sections/requirement IDs plus predecessor task evidence.
      placeholder: |
        PRD: §...
        Depends on: ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this task will implement or prove.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly exclude adjacent/later milestone work.
      placeholder: |
        - Do not copy legacy API.
        - Do not introduce another timeout owner.
        - Do not call private runtime ABI.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Design constraints
      description: Dependencies, ownership/concurrency, resource limits, error and observability constraints.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      placeholder: |
        - Implementation / report
        - Unit/model/platform tests
        - Benchmark/fuzz/native evidence when required
        - ADR/API/docs updates when required
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the task acceptance criteria and add any concrete evidence requirements.
      placeholder: |
        - [ ] ...
        - [ ] exactly-once / idempotent terminal-state verification where applicable
        - [ ] registration/timer/waiter cleanup where applicable
        - [ ] architecture dependency guard
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Fill during execution with exact commands, runs, platforms and artifact links.
      placeholder: |
        Tests:
        Benchmark:
        Native device/VM:
        Fuzz:
